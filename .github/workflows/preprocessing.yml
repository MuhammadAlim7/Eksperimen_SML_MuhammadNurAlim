name: Automate Preprocessing

on:
  push:
    paths:
      - 'Teen_Mental_Health_raw.csv'
      - 'preprocessing/automate_Muhammad-Nur-Alim.py'
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn numpy

    - name: Run preprocessing
      run: |
        cd preprocessing
        python automate_Muhammad-Nur-Alim.py

    - name: Commit and Push Clean Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add preprocessing/Teen_Mental_Health_preprocessing.csv
        git commit -m "Auto-update processed data" || echo "No changes to commit"
        git push
